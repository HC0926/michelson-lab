services:
  - type: web
    name: michelson-lab
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -c "import os; import uvicorn; uvicorn.run('server:app', host='0.0.0.0', port=int(os.getenv('PORT',8000)))"
    envVars:
      - key: DASHSCOPE_API_KEY
        sync: false
